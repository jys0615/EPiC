<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="620" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">EPiC System Architecture</text>

  <!-- ────────────────────────────────────────────── -->
  <!-- CI/CD Section -->
  <!-- ────────────────────────────────────────────── -->
  <rect x="20" y="55" width="860" height="150" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="36" y="78" font-size="12" font-weight="bold" fill="#6366f1">CI / CD Pipeline</text>

  <!-- Developer -->
  <rect x="50" y="90" width="110" height="90" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="105" y="118" text-anchor="middle" font-size="22">💻</text>
  <text x="105" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Developer</text>
  <text x="105" y="156" text-anchor="middle" font-size="10" fill="#666">git push</text>
  <text x="105" y="170" text-anchor="middle" font-size="10" fill="#666">main branch</text>

  <!-- Arrow -->
  <line x1="162" y1="135" x2="198" y2="135" stroke="#6366f1" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- GitHub Actions -->
  <rect x="200" y="90" width="130" height="90" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="265" y="118" text-anchor="middle" font-size="22">⚙️</text>
  <text x="265" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">GitHub Actions</text>
  <text x="265" y="156" text-anchor="middle" font-size="10" fill="#666">Build Images</text>
  <text x="265" y="170" text-anchor="middle" font-size="10" fill="#666">BE / FE / AI</text>

  <!-- Arrow -->
  <line x1="332" y1="135" x2="368" y2="135" stroke="#6366f1" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- DockerHub -->
  <rect x="370" y="90" width="120" height="90" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="430" y="118" text-anchor="middle" font-size="22">🐳</text>
  <text x="430" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">DockerHub</text>
  <text x="430" y="156" text-anchor="middle" font-size="10" fill="#666">epic-be:latest</text>
  <text x="430" y="170" text-anchor="middle" font-size="10" fill="#666">epic-fe / epic-ai</text>

  <!-- Arrow -->
  <line x1="492" y1="135" x2="528" y2="135" stroke="#6366f1" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- SSH Deploy -->
  <rect x="530" y="90" width="130" height="90" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="595" y="118" text-anchor="middle" font-size="22">🔐</text>
  <text x="595" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">SSH Deploy</text>
  <text x="595" y="156" text-anchor="middle" font-size="10" fill="#666">docker-compose</text>
  <text x="595" y="170" text-anchor="middle" font-size="10" fill="#666">pull &amp; up -d</text>

  <!-- Arrow -->
  <line x1="662" y1="135" x2="698" y2="135" stroke="#6366f1" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- Azure VM -->
  <rect x="700" y="90" width="150" height="90" rx="8" fill="#0078D4" stroke="#005a9e" stroke-width="1.5"/>
  <text x="775" y="118" text-anchor="middle" font-size="22">☁️</text>
  <text x="775" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Azure VM</text>
  <text x="775" y="156" text-anchor="middle" font-size="10" fill="#d0e8ff">Standard B2als v2</text>
  <text x="775" y="170" text-anchor="middle" font-size="10" fill="#d0e8ff">2 vCPU / 4GB RAM</text>

  <!-- ────────────────────────────────────────────── -->
  <!-- Runtime Section -->
  <!-- ────────────────────────────────────────────── -->
  <rect x="20" y="225" width="860" height="375" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="36" y="248" font-size="12" font-weight="bold" fill="#16a34a">Runtime (Azure VM · docker-compose)</text>

  <!-- Browser -->
  <rect x="50" y="265" width="110" height="80" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="105" y="293" text-anchor="middle" font-size="22">🌐</text>
  <text x="105" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Browser</text>
  <text x="105" y="330" text-anchor="middle" font-size="10" fill="#666">User</text>

  <!-- Arrow Browser -> FE -->
  <line x1="162" y1="305" x2="205" y2="305" stroke="#22c55e" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="183" y="298" text-anchor="middle" font-size="9" fill="#16a34a">:80</text>

  <!-- FE Container -->
  <rect x="207" y="255" width="150" height="140" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="282" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">FE Container</text>
  <rect x="222" y="285" width="120" height="40" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="282" y="302" text-anchor="middle" font-size="10" fill="#15803d">React + Vite</text>
  <text x="282" y="316" text-anchor="middle" font-size="10" fill="#15803d">정적 파일 서빙</text>
  <rect x="222" y="333" width="120" height="40" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="282" y="350" text-anchor="middle" font-size="10" fill="#15803d">Nginx</text>
  <text x="282" y="364" text-anchor="middle" font-size="10" fill="#15803d">Reverse Proxy</text>

  <!-- Arrow FE -> BE -->
  <line x1="359" y1="305" x2="402" y2="305" stroke="#22c55e" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="380" y="298" text-anchor="middle" font-size="9" fill="#16a34a">/api/*</text>

  <!-- BE Container -->
  <rect x="404" y="255" width="150" height="140" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="479" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">BE Container</text>
  <rect x="419" y="285" width="120" height="40" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="479" y="302" text-anchor="middle" font-size="10" fill="#15803d">Spring Boot</text>
  <text x="479" y="316" text-anchor="middle" font-size="10" fill="#15803d">:8090</text>
  <rect x="419" y="333" width="120" height="40" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="479" y="350" text-anchor="middle" font-size="10" fill="#15803d">GlobalException</text>
  <text x="479" y="364" text-anchor="middle" font-size="10" fill="#15803d">WebClient</text>

  <!-- Arrow BE -> AI -->
  <line x1="556" y1="305" x2="599" y2="305" stroke="#22c55e" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="577" y="298" text-anchor="middle" font-size="9" fill="#16a34a">:8000</text>

  <!-- AI Container -->
  <rect x="601" y="255" width="150" height="140" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="676" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">AI Container</text>
  <rect x="616" y="285" width="120" height="40" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="676" y="302" text-anchor="middle" font-size="10" fill="#15803d">FastAPI</text>
  <text x="676" y="316" text-anchor="middle" font-size="10" fill="#15803d">Python :8000</text>
  <rect x="616" y="333" width="120" height="40" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="676" y="350" text-anchor="middle" font-size="10" fill="#15803d">Tesseract OCR</text>
  <text x="676" y="364" text-anchor="middle" font-size="10" fill="#15803d">OpenAI API</text>

  <!-- External DBs row -->
  <!-- MongoDB -->
  <rect x="207" y="430" width="150" height="80" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="282" y="455" text-anchor="middle" font-size="20">🍃</text>
  <text x="282" y="476" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">MongoDB Atlas</text>
  <text x="282" y="492" text-anchor="middle" font-size="10" fill="#666">회원 정보</text>

  <!-- Redis -->
  <rect x="404" y="430" width="150" height="80" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="479" y="455" text-anchor="middle" font-size="20">⚡</text>
  <text x="479" y="476" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Redis</text>
  <text x="479" y="492" text-anchor="middle" font-size="10" fill="#666">이메일 인증코드 TTL</text>

  <!-- Arrow BE -> MongoDB -->
  <line x1="479" y1="397" x2="479" y2="428" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <line x1="282" y1="397" x2="282" y2="428" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <!-- vertical connector from BE down -->
  <line x1="479" y1="397" x2="282" y2="397" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Arrow BE -> Redis (direct) -->
  <!-- already shown via the horizontal line above -->

  <!-- Legend -->
  <rect x="640" y="430" width="220" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="750" y="452" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Legend</text>
  <line x1="658" y1="468" x2="693" y2="468" stroke="#6366f1" stroke-width="2"/>
  <text x="700" y="472" font-size="10" fill="#444">CI/CD 흐름</text>
  <line x1="658" y1="488" x2="693" y2="488" stroke="#22c55e" stroke-width="2"/>
  <text x="700" y="492" font-size="10" fill="#444">서비스 요청 흐름</text>
  <line x1="658" y1="508" x2="693" y2="508" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="700" y="512" font-size="10" fill="#444">데이터 저장 흐름</text>
  <rect x="658" y="522" width="14" height="14" rx="3" fill="#0078D4"/>
  <text x="700" y="533" font-size="10" fill="#444">Azure (배포 서버)</text>
  <rect x="658" y="542" width="14" height="14" rx="3" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="700" y="553" font-size="10" fill="#444">docker-compose 서비스</text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

</svg>
