name: Build, Push & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up commit SHA
        run: echo "GIT_COMMIT=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build & push BE image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/epic-be:${{ env.GIT_COMMIT }} ./be
          docker tag ${{ secrets.DOCKER_USERNAME }}/epic-be:${{ env.GIT_COMMIT }} ${{ secrets.DOCKER_USERNAME }}/epic-be:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/epic-be:${{ env.GIT_COMMIT }}
          docker push ${{ secrets.DOCKER_USERNAME }}/epic-be:latest

      - name: Build & push FE image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/epic-fe:${{ env.GIT_COMMIT }} ./fe
          docker tag ${{ secrets.DOCKER_USERNAME }}/epic-fe:${{ env.GIT_COMMIT }} ${{ secrets.DOCKER_USERNAME }}/epic-fe:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/epic-fe:${{ env.GIT_COMMIT }}
          docker push ${{ secrets.DOCKER_USERNAME }}/epic-fe:latest

      - name: Build & push AI image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/epic-ai:${{ env.GIT_COMMIT }} ./ai
          docker tag ${{ secrets.DOCKER_USERNAME }}/epic-ai:${{ env.GIT_COMMIT }} ${{ secrets.DOCKER_USERNAME }}/epic-ai:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/epic-ai:${{ env.GIT_COMMIT }}
          docker push ${{ secrets.DOCKER_USERNAME }}/epic-ai:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          source: docker-compose.yml
          target: ~/epic

      - name: Deploy on Azure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            cd ~/epic
            docker-compose pull
            docker-compose up -d --remove-orphans
            docker image prune -f
